<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>差がつく歴史50問｜旧石器〜平安</title>
<meta name="description" content="小5・四谷大塚レベル　旧石器時代～平安時代　差がつく歴史50問（記述式クイズ）">
<style>
:root{
  --page:#1F2F54;--on-page:#eef1f8;--on-page-sub:#b9c3da;--gold:#e8c36a;
  --bg:#f5efe3;--card:#fffdf8;--ink:#2b2622;--sub:#6e645a;--line:#e2d7c4;
  --accent:#b5452f;--accent-ink:#fff;--teal:#2f6f6a;--ans:#f4eee1;--pt:#fff6dc;--pt-line:#e8cf86;
  --ok:#2e7d4f;--mid:#b97f0c;--ng:#c0392b;--shadow:0 2px 10px rgba(60,40,20,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#22335a;--card:#2a3a61;--ink:#eef1f8;--sub:#b3bdd4;--line:#41537f;
    --accent:#e07a5f;--accent-ink:#1F2F54;--teal:#7cc4bd;--ans:#34466f;--pt:#3a3f52;--pt-line:#6d5a27;
    --ok:#5cbf83;--mid:#e3b04b;--ng:#ec6b5e;--shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--page);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.75;font-size:17px;
}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header.top{text-align:center;padding:12px 0 8px}
.badge{display:inline-block;font-size:12px;letter-spacing:.08em;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 12px;margin-bottom:8px}
header.top h1{color:var(--on-page)}
header.top h1 small{color:var(--on-page-sub)!important}
h1{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:clamp(24px,6vw,34px);margin:4px 0 2px;line-height:1.35}
h1 small{display:block;font-size:.5em;color:var(--sub);font-weight:normal;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-top:16px}
h2{font-size:17px;margin:0 0 12px;color:var(--sub);font-weight:600}
.secs{display:grid;gap:8px}
.sec-opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;user-select:none}
.sec-opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.sec-opt .num{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.sec-opt .best{font-size:12px;color:var(--teal);white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:15px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;transition:transform .05s}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:default}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-wide{width:100%;padding:14px;font-size:17px}
.btn-link{border:none;background:none;color:var(--sub);padding:6px 4px;text-decoration:underline;font-size:14px}
.mini{font-size:13px;padding:4px 10px}
.stack{display:grid;gap:10px;margin-top:16px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.qno{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:26px;font-weight:700;color:var(--accent);line-height:1.2}
.qno .star{font-size:14px;color:var(--mid);margin-left:6px;vertical-align:middle}
.qsec{font-size:13px;color:var(--sub)}
.qtext{white-space:pre-wrap;font-size:18px;margin:10px 0 14px}
textarea{width:100%;min-height:84px;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
.hint{font-size:12px;color:var(--sub);margin:4px 0 12px}
.answer{background:var(--ans);border-left:5px solid var(--teal);border-radius:8px;padding:12px 14px;margin-top:12px}
.answer .lbl,.point .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--teal)}
.answer .txt{font-weight:700;font-size:18px;white-space:pre-wrap}
.mine{font-size:14px;color:var(--sub);margin-top:10px;white-space:pre-wrap}
.point{background:var(--pt);border:1px dashed var(--pt-line);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px;white-space:pre-wrap}
.point .lbl{color:var(--mid)}

/* result */
.score{text-align:center}
.score .big{font-size:52px;font-weight:800;color:var(--accent);line-height:1.1}
.score .big small{font-size:20px;color:var(--sub);font-weight:600}
.tally{display:flex;justify-content:center;gap:18px;margin-top:6px;font-weight:700}
.tally .o{color:var(--ok)}.tally .s{color:var(--mid)}.tally .x{color:var(--ng)}
.msg{text-align:center;margin-top:8px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
td.n{text-align:right;white-space:nowrap}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:60px}
.meter>i{display:block;height:100%;background:var(--teal)}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-of-type{border-top:none}
.rev .h{font-weight:700;display:flex;gap:8px;align-items:baseline}
.mark{font-weight:800;min-width:1.4em}
.mark.o{color:var(--ok)}.mark.s{color:var(--mid)}.mark.x{color:var(--ng)}
.rev .q{white-space:pre-wrap;font-size:15px}
.rev .a{white-space:pre-wrap;font-size:15px;background:var(--ans);border-radius:6px;padding:6px 10px;margin-top:6px}

/* list */
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:none}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .q{white-space:pre-wrap}
summary .open{font-size:12px;color:var(--teal);margin-top:4px;display:block}
details[open] summary .open{display:none}
.list-sec{font-weight:700;color:var(--accent);margin:20px 0 4px;font-size:15px}
.hidden{display:none!important}
.judge{text-align:center;font-size:28px;font-weight:800;border-radius:12px;padding:12px;margin-bottom:4px;animation:pop .25s ease-out}
.judge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:2px solid var(--ok)}
.judge.ng{color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,transparent);border:2px solid var(--ng)}
.judge small{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-top:2px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.streak{display:inline-block;margin-left:10px;font-size:13px;font-weight:800;color:#fff;background:linear-gradient(90deg,#e0662f,#d9412b);border-radius:999px;padding:2px 10px;animation:pop .25s ease-out}
.streak.big{background:linear-gradient(90deg,#e8a322,#e0462b);box-shadow:0 0 0 2px rgba(232,163,34,.35)}
.judge .combo{display:block;font-size:16px;font-weight:800;color:#d9412b;margin-top:4px}
.rbest{text-align:center;margin-top:6px;font-weight:700;color:var(--accent)}
.warn{color:var(--ng);font-weight:700;font-size:14px;margin:0 0 8px}
footer{text-align:center;font-size:12px;color:var(--on-page-sub);margin-top:30px}
@media (max-width:420px){body{font-size:16px}.card{padding:16px}.qtext{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="badge">小5・四谷大塚レベル</span>
    <h1><small>旧石器時代～平安時代</small>差がつく歴史50問</h1>
  </header>

  <!-- ===== スタート画面 ===== -->
  <section id="start">
    <div class="card">
      <h2>出題する範囲をえらぼう</h2>
      <div class="secs" id="secList"></div>
      <div class="row" style="margin-top:10px">
        <button class="mini" id="allOn">すべて選ぶ</button>
        <button class="mini" id="allOff">すべて外す</button>
      </div>
    </div>
    <div class="card">
      <h2>出題のしかた</h2>
      <label class="toggle"><input type="checkbox" id="optRandom"> 問題の順番をシャッフルする</label>
    </div>
    <div class="stack">
      <button class="btn-main btn-wide" id="startBtn">スタート</button>
      <button class="btn-wide" id="retryWrongBtn">前回まちがえた問題だけ（<span id="wrongCount">0</span>問）</button>
      <button class="btn-wide" id="listBtn">解答一覧で復習する</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:16px;color:var(--on-page-sub)">
      答えを入力して「答え合わせ」を押すと、正解・不正解が表示されます。<br>
      （Enterキーでも答え合わせできます）
    </p>
  </section>

  <!-- ===== 出題画面 ===== -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qtop">
        <span><span id="qProg">1 / 50</span><span class="streak hidden" id="streak"></span></span>
        <button class="btn-link" id="quitBtn">中断して結果を見る</button>
      </div>
      <div class="bar"><i id="qBar"></i></div>
      <div style="margin-top:10px">
        <div class="qsec" id="qSec"></div>
        <div class="qno" id="qNo"></div>
      </div>
      <div class="qtext" id="qText"></div>

      <div id="beforeReveal">
        <textarea id="myAns" placeholder="ここに答えを入力（漢字でもひらがなでもOK）"></textarea>
        <p class="hint" id="qHint">記述問題は、大事なキーワードが入っているかで判定します。</p>
        <p class="warn hidden" id="emptyWarn">答えを入力してね。</p>
        <button class="btn-main btn-wide" id="checkBtn">答え合わせ</button>
        <div style="text-align:center;margin-top:8px"><button class="btn-link" id="giveupBtn">わからない（答えを見る）</button></div>
      </div>

      <div id="afterReveal" class="hidden">
        <div class="judge" id="judge"></div>
        <div class="mine hidden" id="mineBox"></div>
        <div class="answer"><div class="lbl">答え</div><div class="txt" id="aText"></div></div>
        <div class="point hidden" id="pBox"><div class="lbl">⭐ ポイント</div><div id="pText"></div></div>
        <button class="btn-main btn-wide" id="nextBtn" style="margin-top:14px">次の問題へ</button>
      </div>
    </div>
  </section>

  <!-- ===== 結果画面 ===== -->
  <section id="result" class="hidden">
    <div class="card score">
      <div style="color:var(--sub);font-size:14px">あなたの得点</div>
      <div class="big" id="rPct">0<small>点</small></div>
      <div class="tally"><span class="o" id="rO"></span><span class="x" id="rX"></span></div>
      <div class="msg" id="rMsg"></div>
      <div class="rbest" id="rBest"></div>
    </div>
    <div class="card">
      <h2>範囲別の成績</h2>
      <table id="rTable"></table>
    </div>
    <div class="card" id="rReviewCard">
      <h2>見直そう（まちがえた問題）</h2>
      <div id="rReview"></div>
    </div>
    <div class="stack">
      <button class="btn-main btn-wide" id="rRetry">まちがえた問題にもう一度チャレンジ</button>
      <button class="btn-wide" id="rTop">トップにもどる</button>
    </div>
  </section>

  <!-- ===== 解答一覧 ===== -->
  <section id="list" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">解答一覧（タップで答え）</h2>
        <div class="row">
          <button class="mini" id="openAll">全部ひらく</button>
          <button class="mini" id="closeAll">全部とじる</button>
        </div>
      </div>
      <div id="listBody"></div>
    </div>
    <div class="stack"><button class="btn-wide" id="listTop">トップにもどる</button></div>
  </section>

  <footer>旧石器時代～平安時代　差がつく歴史50問</footer>
</div>

<script>
const SECTIONS = [
  {id:1, title:"Ⅰ　旧石器・縄文・弥生", range:"1～10"},
  {id:2, title:"Ⅱ　古墳・飛鳥時代", range:"11～20"},
  {id:3, title:"Ⅲ　飛鳥～奈良時代", range:"21～32"},
  {id:4, title:"Ⅳ　奈良～平安への流れ", range:"33～40"},
  {id:5, title:"Ⅴ　平安時代・差がつく問題", range:"41～50"}
];

const Q = [
/* ---------- Ⅰ ---------- */
{n:1,s:1,q:"日本列島がまだ大陸と陸続きだったころ、人々は石を打ち欠いてつくった道具を使っていました。このような石器を何といいますか。",
 a:"打製石器"},
{n:2,s:1,q:"旧石器時代の人々が、主にどのような動物を追って移動しながら生活していたか、代表的な動物を2つ答えなさい。",
 a:"ナウマンゾウ、オオツノジカ",
 p:"ほかにマンモス（北海道）なども。大型動物を追って移動していたので、定住はしていなかった。"},
{n:3,s:1,q:"群馬県にある岩宿遺跡が重要な遺跡とされているのは、ここから何が発見されたからですか。",
 a:"日本列島に旧石器時代の人々が住んでいたことを示す打製石器が発見されたから。",
 p:"相沢忠洋が関東ローム層から打製石器を発見。それまで「日本に旧石器時代はなかった」と考えられていた。"},
{n:4,s:1,q:"縄文時代の人々が、食べ物の残りや貝がらなどを捨てた場所を何といいますか。また、これが当時の生活を知る重要な手がかりになる理由を簡単に答えなさい。",
 a:"貝塚。\n食べ物や貝などが残されていて、当時の人々の生活を知ることができるから。",
 p:"大森貝塚（東京都）はモースが発見。何を食べていたか・どんな道具を使ったかがわかる。"},
{n:5,s:1,q:"縄文時代の人々が、食べ物を煮たり、貯蔵したりするために使った道具は何ですか。",
 a:"土器（縄文土器）",
 p:"縄目の文様がついた、厚手で黒褐色の土器。"},
{n:6,s:1,q:"縄文時代の人々が、豊作や生命の誕生などを願って作ったと考えられている土製の人形を何といいますか。",
 a:"土偶",
 p:"「土偶（縄文）」と「埴輪（古墳）」の混同に注意！"},
{n:7,s:1,q:"弥生時代に米づくりが広まったことで、人々の生活にはどのような変化が起こりましたか。\n「むら」という言葉を使って説明しなさい。",
 a:"米を育てるために同じ場所に定住するようになり、むらができた。",
 p:"米づくり → 定住 → むら → 土地・水をめぐる争い → 身分の差\nこの流れは、単語だけでなく因果関係で覚えておくと強い。"},
{n:8,s:1,q:"弥生時代に米づくりとともに大陸から伝わった金属器を2種類答えなさい。",
 a:"青銅器と鉄器",
 p:"青銅器（銅鐸・銅剣など）は主に祭りの道具、鉄器は農具や武器として使われた。"},
{n:9,s:1,q:"弥生時代の米づくりは、日本で自然に始まったのではなく、大陸から伝わったと考えられています。主にどの地域から伝わったと考えられていますか。",
 a:"朝鮮半島",
 p:"中国大陸から朝鮮半島を経て、九州北部に伝わったと考えられている。"},
{n:10,s:1,q:"弥生時代になると、むら同士の争いが増えたと考えられています。その理由を、米づくりとの関係から説明しなさい。",
 a:"米を育てるための土地や水などをめぐって、むら同士が争うようになったから。",
 p:"たくわえた米をうばい合う争いも。吉野ヶ里遺跡（佐賀県）の堀やさくは、争いに備えたもの。"},

/* ---------- Ⅱ ---------- */
{n:11,s:2,q:"3世紀ごろ、近畿地方を中心に大きな勢力が成立しました。この勢力を何といいますか。",
 a:"大和政権（大和朝廷）"},
{n:12,s:2,q:"古墳のまわりや上に並べられた、人物や動物などをかたどった土製品を何といいますか。",
 a:"埴輪"},
{n:13,s:2,q:"日本最大の古墳とされる大仙古墳は、どのような形をしていますか。",
 a:"前方後円墳",
 p:"大阪府堺市にある。仁徳天皇の墓と伝えられている。"},
{n:14,s:2,q:"大和政権の王である大王が、各地の豪族を従えるために行った政治のしくみを何といいますか。\n「氏」という言葉を使って説明しなさい。",
 a:"氏姓制度。\n豪族を氏という集団にまとめ、それぞれの地位や役割を姓によって定めた。"},
{n:15,s:2,q:"聖徳太子が、家柄ではなく能力や功績を重視して役人を取り立てるために定めた制度は何ですか。",
 a:"冠位十二階"},
{n:16,s:2,q:"聖徳太子が定めた十七条の憲法では、役人たちにどのようなことを求めましたか。特に重要な考えを一つ答えなさい。",
 a:"役人は和を大切にして協力して政治を行うこと。",
 p:"「和を以て貴しとなす」をそのまま覚えてもいいが、記述なら\n「役人同士が争わず、協力して政治を行うことを求めた」と書ければOK。"},
{n:17,s:2,q:"聖徳太子が中国の隋に派遣した使いを何といいますか。また、その人物の名前も答えなさい。",
 a:"遣隋使・小野妹子",
 p:"607年。隋と対等な国の関係を結ぼうとした。"},
{n:18,s:2,q:"645年、中大兄皇子と中臣鎌足らが蘇我氏を倒しました。この出来事を何といいますか。",
 a:"乙巳の変（いっしのへん）",
 p:"この事件から始まった一連の政治改革が「大化の改新」。"},
{n:19,s:2,q:"大化の改新では、土地や人民を国家が支配する考え方が示されました。この土地と人民を国家のものとする考え方を何といいますか。",
 a:"公地公民"},
{n:20,s:2,q:"中大兄皇子は後に天智天皇となります。天智天皇が日本で初めて正式な戸籍をつくったとされるのは何という戸籍ですか。",
 a:"庚午年籍（こうごねんじゃく）",
 p:"670年につくられた。"},

/* ---------- Ⅲ ---------- */
{n:21,s:3,q:"天智天皇の死後、皇位をめぐって大きな戦いが起こりました。この戦いを何といいますか。また、勝利した人物は誰ですか。",
 a:"壬申の乱・大海人皇子（のちの天武天皇）",
 p:"672年。天智天皇の弟・大海人皇子が、天智天皇の子・大友皇子に勝った。"},
{n:22,s:3,q:"壬申の乱に勝利した大海人皇子は、天皇になりました。この天皇を何といいますか。",
 a:"天武天皇"},
{n:23,s:3,q:"701年に完成した、日本で最初の本格的な律令は何ですか。\nまた、中心となって制定に関わった人物も答えなさい。",
 a:"大宝律令・藤原不比等",
 p:"23・27・28はセットで！\n701年 大宝律令 → 律令国家\n↓\n743年 墾田永年私財法\n↓\n開墾した土地を永久に所有できる\n↓\n貴族や寺社などが土地を広げる"},
{n:24,s:3,q:"律令政治では、政治を行う中央の役所が「二官八省」に分けられました。二官のうち、神々に関する仕事を担当した役所を何といいますか。",

/* ============ 状態 ============ */
const $ = id => document.getElementById(id);
const LS_KEY = "rekishi50_v1";
let st = {queue:[], pos:0, marks:{}, revealed:false, mine:{}, streak:0, maxStreak:0};

function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; } }
function save(obj){ try{ localStorage.setItem(LS_KEY, JSON.stringify(obj)); }catch(e){} }
let saved = load(); // {wrong:[n...], best:{secId:pct}, secs:[...], random:bool}

function show(id){
  ["start","quiz","result","list"].forEach(s => $(s).classList.toggle("hidden", s!==id));
  window.scrollTo({top:0});
}

/* ============ スタート画面 ============ */
function buildStart(){
  const box = $("secList"); box.innerHTML = "";
  const chosen = saved.secs || SECTIONS.map(s=>s.id);
  SECTIONS.forEach(sec=>{
    const cnt = Q.filter(q=>q.s===sec.id).length;
    const lab = document.createElement("label");
    lab.className = "sec-opt";
    const cb = document.createElement("input");
    cb.type="checkbox"; cb.value=sec.id; cb.checked = chosen.includes(sec.id);
    const t = document.createElement("span"); t.textContent = sec.title;
    const best = document.createElement("span"); best.className="best";
    if(saved.best && saved.best[sec.id]!=null) best.textContent = "最高 " + saved.best[sec.id] + "%";
    const num = document.createElement("span"); num.className="num"; num.textContent = sec.range + "（" + cnt + "問）";
    lab.append(cb,t,num,best);
    box.appendChild(lab);
  });
  $("optRandom").checked = !!saved.random;
  const wc = (saved.wrong||[]).length;
  $("wrongCount").textContent = wc;
  $("retryWrongBtn").disabled = wc===0;
}
function chosenSecs(){ return [...document.querySelectorAll("#secList input:checked")].map(c=>+c.value); }
$("allOn").onclick = ()=>document.querySelectorAll("#secList input").forEach(c=>c.checked=true);
$("allOff").onclick = ()=>document.querySelectorAll("#secList input").forEach(c=>c.checked=false);

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function begin(nums){
  if(!nums.length){ alertBox("出題する範囲を1つ以上えらんでね。"); return; }
  if($("optRandom").checked) shuffle(nums);
  st = {queue:nums, pos:0, marks:{}, revealed:false, mine:{}, streak:0, maxStreak:0};
  show("quiz"); renderQ();
}
function alertBox(msg){
  const p = document.createElement("p");
  p.textContent = msg; p.style.cssText="color:#ffb4a8;text-align:center;font-weight:700";
  $("startBtn").before(p); setTimeout(()=>p.remove(),2500);
}
$("startBtn").onclick = ()=>{
  const secs = chosenSecs();
  saved.secs = secs; saved.random = $("optRandom").checked; save(saved);
  begin(Q.filter(q=>secs.includes(q.s)).map(q=>q.n));
};
$("retryWrongBtn").onclick = ()=>begin([...(saved.wrong||[])]);
$("listBtn").onclick = ()=>{ buildList(); show("list"); };

/* 表記ゆれを吸収：全角半角・カタカナ→ひらがな・記号や空白を除く */
function norm(t){
  return (t||"").normalize("NFKC")
    .replace(/[ァ-ヶ]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
    .replace(/[\s、。，．,.・･\/「」『』（）()【】\[\]〈〉《》!?！？ー―\-〜~：:；;→⇒>＜<＞①②③④⑤]/g,"");
}
function judge(q, input){
  const k = KEYS[q.n], t = norm(input);
  if(!t) return false;
  if(k.alt && k.alt.some(a=>norm(a)===t)) return true;
  if(k.order){
    const pos = k.order.map(al=>{
      const idx = al.map(w=>t.indexOf(norm(w))).filter(i=>i>=0);
      return idx.length ? Math.min(...idx) : -1;
    });
    return pos.every(p=>p>=0) && pos.every((p,i)=>i===0 || p>pos[i-1]);
  }
  const hit = k.g.filter(grp=>grp.some(w=>t.includes(norm(w)))).length;
  return hit >= (k.need ?? k.g.length);
}

/* ============ 出題 ============ */
const qOf = n => Q.find(q=>q.n===n);
function renderQ(){
  const n = st.queue[st.pos], q = qOf(n);
  const total = st.queue.length;
  $("qProg").textContent = (st.pos+1) + " / " + total;
  $("qBar").style.width = (st.pos/total*100) + "%";
  $("qSec").textContent = SECTIONS.find(s=>s.id===q.s).title;
  $("qNo").innerHTML = "";
  $("qNo").append("第" + q.n + "問");
  if(q.star){ const s=document.createElement("span"); s.className="star"; s.textContent="差がつく"; $("qNo").append(s); }
  $("qText").textContent = q.q;
  $("qHint").textContent = HINTS[n] || "記述問題は、大事なキーワードが入っているかで判定します。";
  $("myAns").value = "";
  $("emptyWarn").classList.add("hidden");
  st.revealed = false;
  $("beforeReveal").classList.remove("hidden");
  $("afterReveal").classList.add("hidden");
  $("nextBtn").textContent = st.pos===total-1 ? "結果を見る" : "次の問題へ";
  showStreak();
  setTimeout(()=>$("myAns").focus({preventScroll:true}), 50);
}
function reveal(giveup){
  const n = st.queue[st.pos], q = qOf(n);
  const mine = $("myAns").value.trim();
  if(!giveup && !mine){ $("emptyWarn").classList.remove("hidden"); return; }
  const ok = !giveup && judge(q, mine);
  st.mine[n] = mine;
  st.marks[n] = ok ? "o" : "x";
  const lost = st.streak;
  st.streak = ok ? st.streak + 1 : 0;
  st.maxStreak = Math.max(st.maxStreak, st.streak);
  showStreak();
  const j = $("judge");
  j.className = "judge " + (ok ? "ok" : "ng");
  j.innerHTML = "";
  j.append(ok ? "⭕ 正解！" : (giveup ? "答えを確認しよう" : "❌ 不正解"));
  if(ok && st.streak>=2){ const c=document.createElement("span"); c.className="combo"; c.textContent="🔥 連続" + st.streak + "問正解中！"; j.append(c); }
  if(!ok && !giveup){ const sm=document.createElement("small"); sm.textContent = lost>=2 ? "連続正解は" + lost + "問でストップ… 答えとポイントを確認しよう" : "答えとポイントを確認しよう"; j.append(sm); }
  $("mineBox").classList.toggle("hidden", !mine);
  $("mineBox").textContent = mine ? "あなたの答え：" + mine : "";
  $("aText").textContent = q.a;
  $("pBox").classList.toggle("hidden", !q.p);
  $("pText").textContent = q.p || "";
  $("beforeReveal").classList.add("hidden");
  $("afterReveal").classList.remove("hidden");
  st.revealed = true;
  $("nextBtn").focus({preventScroll:true});
}
function showStreak(){
  const el = $("streak");
  el.classList.toggle("hidden", st.streak < 2);
  el.classList.toggle("big", st.streak >= 5);
  el.textContent = "🔥 連続" + st.streak + "問正解中";
}
$("checkBtn").onclick = ()=>reveal(false);
$("giveupBtn").onclick = ()=>reveal(true);
$("myAns").addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey && !e.isComposing && e.keyCode!==229){ e.preventDefault(); reveal(false); }
});
$("nextBtn").onclick = ()=>next();
function next(){
  if(st.pos < st.queue.length-1){ st.pos++; renderQ(); } else finish();
}
$("quitBtn").onclick = ()=>finish(true);

/* ============ 結果 ============ */
function finish(quit){
  const list = st.queue.filter(n=>st.marks[n]);
  let o=0,x=0;
  list.forEach(n=>{ if(st.marks[n]==="o")o++; else x++; });
  const total = list.length;
  const pct = total ? Math.round(o/total*100) : 0;
  $("rPct").innerHTML = ""; $("rPct").append(String(pct)); const sm=document.createElement("small"); sm.textContent="点"; $("rPct").append(sm);
  $("rO").textContent = "正解 " + o + "問"; $("rX").textContent = "不正解 " + x + "問";
  $("rMsg").textContent = total===0 ? "まだ1問も答えていません。" :
    pct>=90 ? "すばらしい！上位をねらえる実力です。" :
    pct>=70 ? "よくできました！まちがえた問題を見直せば完ぺき。" :
    pct>=50 ? "あと一歩！流れ（因果関係）を意識して復習しよう。" :
              "解答一覧で流れをつかんでから、もう一度チャレンジ！";

  $("rBest").textContent = st.maxStreak>=2 ? "🔥 最高 " + st.maxStreak + "問連続正解！" : "";
  saved.bestStreak = Math.max(saved.bestStreak||0, st.maxStreak);
  // 範囲別
  const tb = $("rTable"); tb.innerHTML = "<tr><th>範囲</th><th></th><th style='text-align:right'>得点率</th></tr>";
  saved.best = saved.best || {};
  SECTIONS.forEach(sec=>{
    const ns = list.filter(n=>qOf(n).s===sec.id);
    if(!ns.length) return;
    const sc = ns.filter(n=>st.marks[n]==="o").length;
    const p = Math.round(sc/ns.length*100);
    // 範囲の全問を解いたときだけ最高記録を更新
    if(ns.length === Q.filter(q=>q.s===sec.id).length && (saved.best[sec.id]==null || p>saved.best[sec.id])) saved.best[sec.id]=p;
    const tr = document.createElement("tr");
    const td1=document.createElement("td"); td1.textContent=sec.title;
    const td2=document.createElement("td"); td2.style.width="35%"; td2.innerHTML='<div class="meter"><i style="width:'+p+'%"></i></div>';
    const td3=document.createElement("td"); td3.className="n"; td3.textContent=p+"%（"+ns.length+"問）";
    tr.append(td1,td2,td3); tb.appendChild(tr);
  });

  // 見直し
  const wrong = list.filter(n=>st.marks[n]!=="o");
  const rv = $("rReview"); rv.innerHTML="";
  $("rReviewCard").classList.toggle("hidden", !wrong.length);
  wrong.slice().sort((a,b)=>a-b).forEach(n=>{
    const q=qOf(n), m=st.marks[n];
    const d=document.createElement("div"); d.className="rev";
    const h=document.createElement("div"); h.className="h";
    const mk=document.createElement("span"); mk.className="mark "+(m||"x"); mk.textContent = "×";
    const t=document.createElement("span"); t.textContent="第"+n+"問";
    h.append(mk,t);
    const qq=document.createElement("div"); qq.className="q"; qq.textContent=q.q;
    const aa=document.createElement("div"); aa.className="a"; aa.textContent="答え："+q.a;
    d.append(h,qq,aa);
    if(st.mine[n]){ const mm=document.createElement("div"); mm.className="mine"; mm.textContent="あなたの答え："+st.mine[n]; d.append(mm); }
    rv.appendChild(d);
  });
  $("rRetry").disabled = !wrong.length;

  // 「まちがえた問題」を記録（今回出題した分を更新）
  const set = new Set(saved.wrong||[]);
  list.forEach(n=>{ if(st.marks[n]==="o") set.delete(n); else set.add(n); });
  saved.wrong = [...set].sort((a,b)=>a-b);
  save(saved);

  st.lastWrong = wrong;
  show("result");
}
$("rRetry").onclick = ()=>begin([...st.lastWrong].sort((a,b)=>a-b));
$("rTop").onclick = ()=>{ buildStart(); show("start"); };

/* ============ 解答一覧 ============ */
function buildList(){
  const body = $("listBody"); body.innerHTML="";
  SECTIONS.forEach(sec=>{
    const h=document.createElement("div"); h.className="list-sec"; h.textContent=sec.title+"（"+sec.range+"）";
    body.appendChild(h);
    Q.filter(q=>q.s===sec.id).forEach(q=>{
      const d=document.createElement("details");
      const sm=document.createElement("summary");
      const qq=document.createElement("div"); qq.className="q"; qq.textContent=q.n+". "+q.q;
      const op=document.createElement("span"); op.className="open"; op.textContent="▶ 答えを見る";
      sm.append(qq,op);
      const a=document.createElement("div"); a.className="answer";
      const al=document.createElement("div"); al.className="lbl"; al.textContent="答え";
      const at=document.createElement("div"); at.className="txt"; at.textContent=q.a;
      a.append(al,at);
      d.append(sm,a);
      if(q.p){ const p=document.createElement("div"); p.className="point"; const pl=document.createElement("div"); pl.className="lbl"; pl.textContent="⭐ ポイント"; const pt=document.createElement("div"); pt.textContent=q.p; p.append(pl,pt); d.append(p); }
      body.appendChild(d);
    });
  });
}
$("openAll").onclick = ()=>document.querySelectorAll("#listBody details").forEach(d=>d.open=true);
$("closeAll").onclick = ()=>document.querySelectorAll("#listBody details").forEach(d=>d.open=false);
$("listTop").onclick = ()=>{ buildStart(); show("start"); };

buildStart();
</script>
